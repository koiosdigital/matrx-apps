name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: matrx check (every app)
        run: |
          set -e
          for d in apps/*/manifest.json; do
            app=$(dirname "$d")
            echo "::group::matrx check $app"
            pnpm exec matrx check "$app"
            echo "::endgroup::"
          done

  publish:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # R2 S3-compatible credentials (R2 API token) + account for the endpoint.
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Bundle every app
        run: |
          set -e
          for d in apps/*/manifest.json; do
            app=$(basename "$(dirname "$d")")
            pnpm exec matrx bundle "apps/$app" -o "dist/$app"
          done
      - name: Upload bundles to R2 (unversioned — replace in place at apps/<id>/)
        run: |
          set -e
          for d in apps/*/manifest.json; do
            app=$(basename "$(dirname "$d")")
            id=$(node -p "require('./dist/$app/manifest.json').id")
            echo "::group::upload $id"
            aws s3 cp "dist/$app/bundle.js" \
              "s3://kd-matrx-apps/apps/$id/bundle.js" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/javascript
            aws s3 cp "dist/$app/manifest.json" \
              "s3://kd-matrx-apps/apps/$id/manifest.json" \
              --endpoint-url "$R2_ENDPOINT" --content-type application/json
            echo "::endgroup::"
          done
      - name: Remove apps deleted from the repo
        run: |
          set -e
          # Registry keys are manifest ids (may differ from directory names),
          # so build the expected set from the built manifests.
          expected=$(for d in apps/*/manifest.json; do
            app=$(basename "$(dirname "$d")")
            node -p "require('./dist/$app/manifest.json').id"
          done)
          aws s3 ls "s3://kd-matrx-apps/apps/" --endpoint-url "$R2_ENDPOINT" \
            | awk '$1 == "PRE" {print $2}' | sed 's#/$##' \
            | while read -r id; do
                if ! grep -qxF "$id" <<< "$expected"; then
                  echo "::group::delete stale app $id"
                  aws s3 rm "s3://kd-matrx-apps/apps/$id/" --recursive \
                    --endpoint-url "$R2_ENDPOINT"
                  echo "::endgroup::"
                fi
              done
